project:
  name: "Trading Arbitrage Bot"
  environment: "local"

data:
  symbol: "BTCUSDT"
  asset_class: "crypto"
  timeframe: "1h"
  path: "data/sample/btc_usdt_1h.csv"
  timestamp_column: "timestamp"
  timezone: "UTC"

backtest:
  initial_capital: 10000.0
  base_currency: "USD"
  start_date: null
  end_date: null
  periods_per_year: 8760

strategy:
  name: "mean_reversion"
  lookback_window: 20
  entry_z_score: -2.0
  exit_z_score: -0.25
  stop_z_score: -3.5
  min_bars_required: 30

ml:
  horizon_bars: 6
  train_ratio: 0.60
  validation_ratio: 0.20
  min_return_threshold: 0.001
  probability_threshold: 0.60
  exit_probability: 0.50
  model_artifact_dir: "outputs/models"
  model_artifact_path: null

risk:
  risk_per_trade_pct: 0.01
  max_position_notional_pct: 0.50
  min_cash_pct: 0.05
  stop_distance_pct: 0.02
  min_order_notional: 10.0

execution:
  execution_timing: "next_bar_open"
  fee_rate: 0.001
  slippage_bps: 5.0
  allow_fractional_quantity: true
  pessimistic_intrabar_policy: true

reporting:
  output_dir: "outputs/backtests"
  save_trades: true
  save_equity_curve: true
  save_benchmark_curve: true
  save_execution_log: true